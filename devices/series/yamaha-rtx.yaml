vendor: "Yamaha"
transport: ssh
prompt_regex: '.*[#>]\s*$'
commands:
  show_system:
    label: "System Info"
    description: "システム情報を表示"
    cmd: "show environment"
    parse: "yamaha_system"
    category: "system"
  show_status_boot:
    label: "Boot Info"
    description: "起動情報を表示（代替システム情報）"
    cmd: "show status boot 0"
    parse: "yamaha_status"
    category: "system"
  show_status_packet_buffer:
    label: "パケットバッファ状態"
    description: "パケットバッファの割り当て状況と失敗回数を表示"
    cmd: "show status packet-buffer"
    parse: "raw"
    category: "resource"
  show_status_lan1:
    label: "LAN1 Status"
    description: "LAN1 インターフェースの状態を取得"
    cmd: "show status lan1"
    parse: "yamaha_status"
    category: "interface"
  show_status_lan2:
    label: "LAN2 Status"
    description: "LAN2 インターフェースの状態を取得"
    cmd: "show status lan2"
    parse: "yamaha_status"
    category: "interface"
  show_status_lan3:
    label: "LAN3 Status"
    description: "LAN3 インターフェースの状態を取得"
    cmd: "show status lan3"
    parse: "yamaha_status"
    category: "interface"
  show_status_lan4:
    label: "LAN4 Status"
    description: "LAN4 インターフェースの状態を取得"
    cmd: "show status lan4"
    parse: "yamaha_status"
    category: "interface"
  show_route:
    label: "IPv4 ルーティングテーブル"
    description: "IP経路情報を取得"
    cmd: "show ip route"
    parse: "yamaha_route"
    category: "routing"
  show_ipv6_route:
    label: "IPv6 ルーティングテーブル"
    description: "IPv6経路情報を取得"
    cmd: "show ipv6 route"
    parse: "raw"
    category: "routing"
  show_arp:
    label: "ARPテーブル"
    description: "IPv4アドレスとMACアドレスの対応を表示"
    cmd: "show arp"
    parse: "raw"
    category: "network"
  show_ipv6_neighbor:
    label: "IPv6近隣キャッシュ"
    description: "IPv6近隣ノードのキャッシュを表示"
    cmd: "show ipv6 neighbor cache"
    parse: "raw"
    category: "network"
  show_status_dhcp:
    label: "DHCPサーバー状態"
    description: "DHCPのリース状態と統計を表示"
    cmd: "show status dhcp"
    parse: "raw"
    category: "dhcp_dns"
  show_status_dhcpc:
    label: "DHCPクライアント状態"
    description: "DHCPクライアントで取得した情報を表示"
    cmd: "show status dhcpc"
    parse: "raw"
    category: "dhcp_dns"
  show_dns_cache:
    label: "DNSキャッシュ"
    description: "ルーターが保持するDNSキャッシュを表示"
    cmd: "show dns cache"
    parse: "raw"
    category: "dhcp_dns"
  show_ip_connection:
    label: "IPv4接続一覧"
    description: "現在ルーターを通過しているIPv4接続を表示"
    cmd: "show ip connection"
    parse: "raw"
    category: "sessions"
  show_nat_session_summary:
    label: "NATセッション概要"
    description: "NATディスクリプターのセッション使用状況を表示"
    cmd: "show nat descriptor masquerade session summary"
    parse: "raw"
    category: "sessions"
  show_status_pp:
    label: "PP接続状態"
    description: "PPインターフェースの接続状態を表示"
    cmd: "show status pp"
    parse: "raw"
    category: "wan_vpn"
  show_status_tunnel:
    label: "トンネル状態"
    description: "トンネルインターフェースの状態を表示"
    cmd: "show status tunnel"
    parse: "raw"
    category: "wan_vpn"
  show_ipsec_sa:
    label: "IPsec SA"
    description: "確立中のIPsecセキュリティアソシエーションを表示"
    cmd: "show ipsec sa"
    parse: "raw"
    category: "wan_vpn"
  show_log:
    label: "システムログ"
    description: "ルーターに記録されたログを表示"
    cmd: "show log"
    parse: "raw"
    category: "logs"
  show_command_history:
    label: "コマンド履歴"
    description: "ルーターで実行されたコマンド履歴を表示"
    cmd: "show command history"
    parse: "raw"
    category: "logs"
  show_status_user:
    label: "ログインユーザー"
    description: "現在ログインしているユーザーを表示"
    cmd: "show status user"
    parse: "raw"
    category: "security"
  show_sshd_host_key:
    label: "SSHホスト鍵"
    description: "SSHサーバーのホスト鍵情報を表示"
    cmd: "show sshd host key"
    parse: "raw"
    category: "security"
  show_config_difference:
    label: "未保存の設定差分"
    description: "保存済み設定と現在の設定との差分を表示"
    cmd: "show config difference"
    parse: "raw"
    category: "configuration"
  show_config:
    label: "現在の設定"
    description: "現在動作中の設定全体を表示"
    cmd: "show config"
    parse: "raw"
    category: "configuration"
