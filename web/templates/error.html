<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{code}} — router-ui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="connect-screen">
    <div class="connect-panel">
      <div class="connect-header">
        <img src="/img/logo_blue.png" alt="Router UI" class="app-logo-img">
        <span class="section-label">ver 0.0.1</span>
      </div>
      <div style="font-size:var(--font-size-lg);color:var(--text-secondary);margin-bottom:16px">{{code}}</div>
      <div style="font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:16px">{{title}}</div>
      <div style="font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:16px">{{message}}</div>
      <a href="/" style="color:var(--link);font-size:var(--font-size-sm)">戻る</a>
    </div>
  </div>
</body>
</html>
