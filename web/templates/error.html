<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{code}} — router-ui</title>
  <link rel="icon" type="image/png" href="/img/logo_blue.png">
  <link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-jp/400.css">
  <link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-jp/500.css">
  <link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-jp/600.css">
  <link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-jp/700.css">
  <link rel="stylesheet" href="/vendor/fonts/jetbrains-mono/400.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="connect-screen">
    <div class="connect-panel">
      <div class="connect-header">
        <img src="/img/logo_blue.png" alt="Router UI" class="app-logo-img">
        <span class="section-label">ver {{version}}</span>
      </div>
      <div class="status-page">
        <p class="status-code">{{code}}</p>
        <h1 class="status-title">{{title}}</h1>
        <p class="status-copy">{{message}}</p>
        <a href="/" class="text-link">接続画面へ戻る</a>
      </div>
    </div>
  </div>
</body>
</html>
