<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{code}} — router-ui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="connect-screen">
    <div class="connect-panel">
      <div class="connect-header">
        <img src="/img/logo_blue.png" alt="Router UI" class="app-logo-img">
        <span class="section-label">ver 0.0.1</span>
      </div>
      <div class="status-page">
        <p class="status-code">{{code}}</p>
        <h1 class="status-title">{{title}}</h1>
        <p class="status-copy">{{message}}</p>
        <a href="/" class="text-link">接続画面へ戻る</a>
      </div>
    </div>
  </div>
</body>
</html>
