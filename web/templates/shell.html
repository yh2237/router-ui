<div class="app-header">
  <img src="/img/logo_white.png" alt="Router UI" class="app-header-logo-img">
  <div class="header-device">
    <span class="device-model">{{model}}</span>
    <span class="device-host">{{host}}</span>
    <span class="status-dot up"></span>
    <span style="font-size:var(--font-size-xs)">接続中</span>
  </div>
  <div class="header-spacer"></div>
  <button class="btn-disconnect" hx-delete="/api/device/{{connId}}" hx-target="#app-root"
    hx-swap="innerHTML">切断</button>
</div>
<div class="tab-bar">
  <button class="tab active"
    hx-get="/api/device/{{connId}}/dashboard"
    hx-target="#tab-content"
    onclick="document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});this.classList.add('active')">ダッシュボード</button>
  <button class="tab"
    hx-get="/api/device/{{connId}}/settings"
    hx-target="#tab-content"
    onclick="document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});this.classList.add('active')">設定</button>
  <button class="tab"
    hx-get="/api/device/{{connId}}/terminal"
    hx-target="#tab-content"
    onclick="document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});this.classList.add('active')">ターミナル</button>
</div>
<div class="main-content">
  <div id="tab-content"
    hx-get="/api/device/{{connId}}/dashboard"
    hx-trigger="load"
    hx-target="this">
    <div class="dash-loading">読み込み中...</div>
  </div>
</div>
