<div class="connect-screen">
  <div class="connect-panel">
    <div class="connect-header">
      <img src="/img/logo_blue.png" alt="Router UI" class="app-logo-img">
      <span class="section-label">ver {{version}}</span>
    </div>
    <div class="status-page">
      <p class="status-code">Connection error</p>
      <h1 class="status-title">接続できませんでした</h1>
      <div class="error-message">
        接続情報と機器の状態を確認してください。
        <span class="error-detail">機器からの応答: {{error}}</span>
      </div>
      <a href="/" class="text-link">接続画面へ戻る</a>
    </div>
  </div>
</div>
