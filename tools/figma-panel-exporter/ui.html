<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 13px Inter, sans-serif; }
    body { margin: 0; padding: 20px; color: var(--figma-color-text); background: var(--figma-color-bg); }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 16px; line-height: 1.6; color: var(--figma-color-text-secondary); }
    label { display: grid; gap: 6px; margin-bottom: 16px; font-weight: 600; }
    input { height: 32px; padding: 0 10px; border: 1px solid var(--figma-color-border); border-radius: 5px; background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
    .actions { display: flex; gap: 8px; }
    button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 5px; cursor: pointer; }
    #export { color: #fff; background: #0d99ff; }
    #cancel { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
    #status { min-height: 72px; margin-top: 18px; padding: 12px; border-radius: 5px; white-space: pre-wrap; line-height: 1.5; background: var(--figma-color-bg-secondary); }
    .error { color: var(--figma-color-text-danger); }
  </style>
</head>
<body>
  <h1>router-ui Panel Exporter</h1>
  <p>完成パネルのFrameを1つ選択し、部品PNG・座標・ラベルを単一ファイルへ書き出します。</p>
  <label>
    Figma制作倍率
    <input id="sourceScale" type="number" min="0.1" step="0.1" value="2">
  </label>
  <div class="actions">
    <button id="export">エクスポート</button>
    <button id="cancel">閉じる</button>
  </div>
  <div id="status">待機中</div>
  <script>
    const status = document.getElementById("status");
    document.getElementById("export").onclick = () => {
      status.className = "";
      status.textContent = "PNGと構造を生成しています…";
      parent.postMessage({
        pluginMessage: {
          type: "export",
          sourceScale: document.getElementById("sourceScale").value
        }
      }, "*");
    };
    document.getElementById("cancel").onclick = () => {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    };
    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (message.type === "error") {
        status.className = "error";
        status.textContent = message.message;
        return;
      }
      if (message.type !== "result") return;
      const json = JSON.stringify(message.payload, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const name = message.payload.panel.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      anchor.href = url;
      anchor.download = `${name}.router-panel.json`;
      anchor.click();
      URL.revokeObjectURL(url);
      const warnings = message.payload.warnings.length;
      status.textContent = `エクスポート完了\n部品: ${message.payload.parts.length}\n配置: ${message.payload.instances.length}\nラベル: ${message.payload.labels.length}\n警告: ${warnings}`;
    };
  </script>
</body>
</html>
